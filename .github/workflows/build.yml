name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.38.5'
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  NDK_VERSION: r28c
  GO_VERSION: '1.22'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Configure Flutter to use Android SDK
        run: flutter config --android-sdk $ANDROID_HOME

      # 🆕 نصب NDK برای کامپایل کتابخانه‌های بومی
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Clean up disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          df -h
          sudo rm -rf /opt/ghc
          df -h
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h
          rm -rf ~/.gradle/caches
          df -h
          sudo apt-get autoremove -y
          df -h
          sudo apt-get clean 
          df -h

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Generate Dummy Keystore
        run: |
          keytool -genkey -v -keystore android/key.jks -storepass password -alias dummy -keypass password -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Dummy, OU=Dummy, O=Dummy, L=Dummy, S=Dummy, C=US"
          echo "storeFile=$(pwd)/android/key.jks" > android/key.properties
          echo "storePassword=password" >> android/key.properties
          echo "keyPassword=password" >> android/key.properties
          echo "keyAlias=dummy" >> android/key.properties

      - name: Install dependencies
        run: |
          make android-apk-install-deps  
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Prepare Android
        run: |
          make android-apk-prepare

      - name: Build Android APK
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          make android-apk-release

      - name: Copy APK to out
        run: |
          mkdir out
          cp ./build/app/outputs/flutter-apk/*arm64-v8a*.apk out/MyVpn-arm64.apk || echo "no arm64 apk"
          cp ./build/app/outputs/flutter-apk/*armeabi-v7a*.apk out/MyVpn-arm7.apk || echo "no arm7 apk"
          cp ./build/app/outputs/flutter-apk/app-release.apk out/MyVpn-universal.apk || echo "no universal apk"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: MyVpn-APK
          path: ./out
